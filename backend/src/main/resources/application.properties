server.port=8080

# Database Configuration (H2 File-backed MySQL Mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/inmms_db;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Application Custom Properties
inmms.monitoring.interval-ms=10000
inmms.ml-service.url=http://localhost:5000/predict
inmms.ml-service.enabled=true

# Logging
logging.level.com.inmms=INFO
logging.level.org.hibernate.SQL=WARN
